services:
  nginx:
    image: nginx:latest
    container_name: tuxhydro_nginx
    restart: unless-stopped
    cap_add:
      - "NET_BIND_SERVICE"
    networks:
      - nginx_net
    ports:
      - "5173:5173" # Borrar luego
      - "${PORT_FRONT}:3000"
      - "${PORT_CORE}:8000"
      - "${PORT_PGADMIN}:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_core:
        condition: service_started

  frontend:
    container_name: tuxhydro_frontend
    image: tuxhydro_frontend
    restart: unless-stopped
    build:
      context: ../Front
      dockerfile: ./dockerfiles/prod/Dockerfile
    env_file: ./.env
    networks:
      - nginx_net
      - api_net
  
  frontend_dev: # Borrar luego
    container_name: tuxhydro_frontend_dev
    image: tuxhydro_frontend_dev
    restart: unless-stopped
    build:
      context: ../Front
      dockerfile: ./dockerfiles/dev/Dockerfile
    env_file: ./.env
    networks:
      - nginx_net
      - api_net
    volumes:
      - ../Front/front/src:/app/src
      - ../Front/front/static:/app/static

  api_core:
    container_name: tuxhydro_api_core
    image: tuxhydro_api_core
    restart: unless-stopped
    build:
      context: ../Core
      dockerfile: Dockerfile
    env_file: ./.env
    secrets:
      - postgres_password
    networks:
      - api_net
      - nginx_net
      - gis_net
    volumes:
      - ../Front/front/static/graphs:/api/graphs:ro
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.10
    container_name: pgadmin_web
    restart: unless-stopped
    env_file: ./.env
    networks:
      - gis_net
      - nginx_net
    volumes:
      - pgadmin:/var/lib/pgadmin

  db:
    container_name: gis_db
    env_file: ./.env
    image: postgis/postgis
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - gis_net
    ports:
      - "${PORT_DB_PG}:5432" # Quitar exposición de db para prod
    volumes:
      - postgresql:/var/lib/postgresql/data
      - ../../scripts/ddl/00_prep.sql:/docker-entrypoint-initdb.d/00_prep.sql:ro
      - ../../scripts/ddl/01_create_embalses_geometry.sql:/docker-entrypoint-initdb.d/01_create_embalses_geometry.sql:ro
      - ../../scripts/ddl/02_create_embalses_points.sql:/docker-entrypoint-initdb.d/02_create_embalses_points.sql:ro
      - ../../scripts/ddl/03_create_flow_tables.sql:/docker-entrypoint-initdb.d/03_create_flow_tables.sql:ro
      - ../../scripts/ddl/04_create_rain_tables.sql:/docker-entrypoint-initdb.d/04_create_rain_tables.sql:ro
      - ../../scripts/ddl/05_create_predicted.sql:/docker-entrypoint-initdb.d/05_create_predicted.sql:ro
      - ../../scripts/dml/01_populate_embalses_geometry.sql:/docker-entrypoint-initdb.d/01_populate_embalses_geometry.sql:ro
      - ../../scripts/dml/02_populate_embalses_points.sql:/docker-entrypoint-initdb.d/02_populate_embalses_points.sql:ro
      - ../../scripts/dml/03_populate_flow_data.sql:/docker-entrypoint-initdb.d/03_populate_flow_data.sql:ro
      - ../../scripts/dml/04_populate_rain_data.sql:/docker-entrypoint-initdb.d/04_populate_rain_data.sql:ro
      - ../../scripts/dml/05_populate_predicted.sql:/docker-entrypoint-initdb.d/05_populate_predicted.sql:ro
      - ../../data/Caudal/caudal_stations.csv:/tmp/grdc_stations.csv:ro
      - ../../data/Caudal/caudal_flow.csv:/tmp/grdc_flow.csv:ro
      - ../../data/Precipitación/estaciones/rain_stations.csv:/tmp/rain_stations.csv:ro
      - ../../data/Precipitación/data/unificado/data.csv:/tmp/rain_data.csv:ro
      - ../../data/Calculo_caudal/predicted_data.csv:/tmp/predicted_data.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  nginx_net:
    driver: bridge
    name: net_nginx_tuxhydro

  front_net:
    driver: bridge
    name: net_front_tuxhydro

  api_net:
    driver: bridge
    name: net_api_tuxhydro

  gis_net:
    driver: bridge
    name: net_gis_tuxhydro

volumes:
  postgresql:
    name: gis_vol_pg

  pgadmin:
    name: pgadmin_vol_pgadmin

secrets:
  postgres_password:
    file: ../Secrets/postgres_password
