services:
  nginx:
    image: nginx:latest
    container_name: tuxhydro_nginx
    restart: unless-stopped
    cap_add:
      - "NET_BIND_SERVICE"
    networks:
      - nginx_net
    ports:
      - "${PORT_FRONT}:5173"
      - "${PORT_CORE}:8000"
      - "${PORT_PGADMIN}:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_core:
        condition: service_started
      frontend:
        condition: service_started

  frontend:
    container_name: tuxhydro_frontend
    build:
      context: ../Front
      dockerfile: Dockerfile.dev
    env_file: ./.env
    networks:
      - nginx_net
      - api_net
    volumes:
      - ../Front/front/src:/usr/src/app/src
      - ../Front/front/static:/usr/src/app/static

  api_core:
    container_name: tuxhydro_api_core
    build:
      context: ../Core
      dockerfile: Dockerfile.core
    env_file: ./.env
    secrets:
      - postgres_password
    networks:
      - api_net
      - nginx_net
      - gis_net
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.10
    container_name: pgadmin_web
    restart: unless-stopped
    env_file: ./.env
    networks:
      - gis_net
      - nginx_net
    volumes:
      - pgadmin:/var/lib/pgadmin

  db:
    container_name: gis_db
    env_file: ./.env
    image: postgis/postgis
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - gis_net
    ports:
      - "${PORT_DB_PG}:5432" # Quitar exposición de db para prod
    volumes:
      - postgresql:/var/lib/postgresql/data
      - ../../scripts/init-embalses-geom-shp2pgsql.sql:/docker-entrypoint-initdb.d/01-init-embalses-geom.sql:ro
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ../../scripts/init-grdc-data.sql:/docker-entrypoint-initdb.d/03-init-grdc-data.sql:ro
      - ../../data/Caudal/caudal_stations.csv:/tmp/grdc_stations.csv:ro
      - ../../data/Caudal/caudal_flow.csv:/tmp/grdc_flow.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  nginx_net:
    driver: bridge
    name: net_nginx_tuxhydro

  front_net:
    driver: bridge
    name: net_front_tuxhydro

  api_net:
    driver: bridge
    name: net_api_tuxhydro

  gis_net:
    driver: bridge
    name: net_gis_tuxhydro

volumes:
  postgresql:
    name: gis_vol_pg

  pgadmin:
    name: pgadmin_vol_pgadmin

secrets:
  postgres_password:
    file: ../Secrets/postgres_password
